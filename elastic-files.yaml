reindexCommands:
- name: ehi-reindex-iteh-staging
  schedule:
  - 1h
  source:
    index: vseca-vfgrp-asset-inventory-endpoint-health-inventory
    _source:
    - host.name
    query:
      match:
        status: active
  dest:
    index: vseca-vgvg-iteh-asset-staging-list
    pipeline: set-created-time
  script:
    source: "ctx._id = ctx._source.host.name"
- name: asset-inventory-reindex-iteh-staging
  schedule:
  - daily
  source:
    index:
    - vseca-vfgrp-asset-inventory-mcafee
    - vseca-vfgrp-asset-inventory-sep
    - vseca-vfgrp-asset-inventory-trendmicro
    - vseca-vfgrp-asset-inventory-tanium
    - vseca-vfgrp-asset-inventory-oit-spider
    - vseca-vfgrp-asset-inventory-vftr-mandiant
    _source:
    - host.name
    query:
      range:
        event.ingested:
          gte: now-90d/d # this is to prevent old unreported assets being continously added to the staging index and slowing the process down.
  dest:
    index: vseca-vgvg-iteh-asset-staging-list
    pipeline: set-created-time
  script:
    source: "ctx._id = ctx._source.host.name"
- name: vodacom-mandiant-reindex-iteh-staging
  schedule:
  - 1h
  source:
    index:
    - transform-vseca-vgvg-mandiant-hosts
    _source:
    - host.name
    query:
      range:
        mandiant.last_poll_timestamp:
          gte: now-30d/d # this is to prevent old unreported assets being continously added to the staging index and slowing the process down.
  dest:
    index: vseca-vgvg-iteh-asset-staging-list
    pipeline: set-created-time
  script:
    source: "ctx._id = ctx._source.host.name"
- name: mde-sca-reindex-iteh-staging
  schedule:
  - 6h
  source:
    index:
    - transform-mde-secure-config-assessment-scid-latest
    _source:
    - host.name
    query:
      bool:
        must:
          - match:
              event.code: scid-20000
          - range:
              microsoft.mde.reportTime:
                gte: now-90d/d
  dest:
    index: vseca-vgvg-iteh-asset-staging-list
    pipeline: set-created-time
  script:
    source: "ctx._id = ctx._source.host.name"
- name: mma-reindex-iteh-staging
  schedule:
  - 6h
  source:
    index:
    - transform-vseca-vgvg-microsoft-mma-heartbeats-latest
    _source:
    - host.name
    query:
      range:
        microsoft.mma.report_time:
          gte: now-90d/d
  dest:
    index: vseca-vgvg-iteh-asset-staging-list
    pipeline: set-created-time
  script:
    source: "ctx._id = ctx._source.host.name"
- name: qualys-reindex-iteh-staging
  schedule:
  - 1h
  source:
    index:
    - transform-vseca-vgvg-vf-qualys-posture-pc-data-latest
    _source:
    - host.name
    query:
      range:
        qualys.posture.info.evaluation_date:
          gte: now-90d/d
  dest:
    index: vseca-vgvg-iteh-asset-staging-list
    pipeline: set-created-time
  script:
    source: "ctx._id = ctx._source.host.name"
- name: it-hardening-dc-reindex-iteh-staging
  schedule:
  - 6h
  source:
    index:
    - vseca-vgvg-vf-ithardening-data
    _source:
    - host.name
    query:
      range:
        event.ingested:
          gte: now-90d/d
  dest:
    index: vseca-vgvg-iteh-asset-staging-list
    pipeline: set-created-time
  script:
    source: "ctx._id = ctx._source.host.name"
- name: iteh-main-reporting-index
  schedule:
  - 6h
  source:
    index:
    - vseca-vgvg-iteh-asset-staging-list
  dest:
    index: vseca-vgvg-iteh-assets-main-reporting
    pipeline: iteh-main-reporting-index-production
  script:
    source: "ctx._id = ctx._source.host.name"
- name: iteh-cloud-reporting-index
  schedule:
  - 6h
  source:
    index:
    - vseca-vgvg-iteh-cloud-asset-staging-list
  dest:
    index: vseca-vgvg-iteh-assets-cloud-reporting
    pipeline: iteh-cloud-reporting-index-production
  script:
    source: "ctx._id = ctx._source.host.hostname"
- name: iteh-main-reporting-index-history
  schedule:
  - 6h+1
  source:
    index:
    - vseca-vgvg-iteh-assets-main-reporting
  dest:
    index: vseca-vgvg-iteh-assets-main-reporting-history
  script:
    source: "ctx._id=null"
- name: iteh-cloud-reporting-index-history
  schedule:
  - 6h+1
  source:
    index:
    - vseca-vgvg-iteh-assets-cloud-reporting
  dest:
    index: vseca-vgvg-iteh-assets-cloud-reporting-history
  script:
    source: "ctx._id=null"
- name: pcs-inventory-cloud-assets
  schedule:
  - 6h
  source:
    index:
    - transform-vseca-vgvg-asset-inventory-vcloudsmart-latest
    _source:
    - host.hostname
    query:
      bool:
        must:
          - range:
              pcs.vcloudsmart.lastSeen:
                gte: now-1d/d
          - exists:
              field: host.hostname
  dest:
    index: vseca-vgvg-iteh-cloud-asset-staging-list
    pipeline: set-created-time
  script:
    source: "ctx._id = ctx._source.host.hostname"
- name: iteh-central-reporting-cloud-assets-to-staging
  schedule:
  - 6h
  source:
    index:
    - vseca-vgvg-iteh-assets-main-reporting
    _source:
    - host.hostname
    query:
      bool:
        must:
          - match:
              vodafone.vf_asset_information.cloud_asset: true
          - match:
              vodafone.vf_iteh_scope.in_scope: true
          - exists:
              field: "host.hostname"
          - regexp:
              host.hostname: ".*\\..*"
  dest:
    index: vseca-vgvg-iteh-cloud-asset-staging-list
    pipeline: set-created-time
  script:
    source: "ctx._id = ctx._source.host.hostname"
- name: mde-device-tag-cloud-assets-to-staging
  schedule:
  - 6h
  source:
    index:
    - transform-mde-device-tags-latest-host
    _source:
    - host.hostname
    query:
      bool:
        must:
          - match:
              vodafone.vf_asset_information.cloud_asset: true
          - exists:
              field: host.hostname
          - range:
              lastSeen:
                gte: now-7d/d
          - regexp:
              host.hostname: ".*\\..*"
  dest:
    index: vseca-vgvg-iteh-cloud-asset-staging-list
    pipeline: set-created-time
  script:
    source: "ctx._id = ctx._source.host.hostname"
- name: icms-non-cloud-to-staging-index
  schedule:
  - 6h
  source:
    index:
    - vseca-vgvg-asset-inventory-icms
    _source:
    - host.name
    query:
      bool:
        should:
          bool:
            must:
              - match:
                  icms_data.cs_status: "deployed"
              - range:
                  icms_data.cs_lastscandate:
                    gte: now-7d/d
              - terms:
                  icms_data.cs_tier2:
                    - Virtual Server
                    - Logical Server
            must_not:
              - exists:
                  field: cloud
          bool:
            must:
              - match:
                  cloud.provider: "oci drcc"

  dest:
    index: vseca-vgvg-iteh-asset-staging-list
    pipeline: set-created-time
  script:
    source: "ctx._id = ctx._source.host.name"
- name: icms-cloud-to-staging-index
  schedule:
  - 6h
  source:
    index:
    - vseca-vgvg-asset-inventory-icms
    _source:
    - host.hostname
    query:
      bool:
        must:
          - match:
              icms_data.cs_status: "deployed"
          - range:
              icms_data.cs_lastscandate:
                gte: now-7d/d
          - terms:
              icms_data.cs_tier2:
                - Virtual Server
                - Logical Server
          - exists:
              field: cloud
        must_not:
          - match:
              cloud.provider: "oci drcc"
  dest:
    index: vseca-vgvg-iteh-cloud-asset-staging-list
    pipeline: set-created-time
  script:
    source: "ctx._id = ctx._source.host.hostname"
- name: reindex-mdvm-vuln-high-value-latest
  schedule:
  - 6h
  source:
    index: transform-vseca-vgvg-mdvm-software-vulnerabilities-highvalue-latest
  dest:
    index: transform-vseca-vgvg-mdvm-software-vulnerabilities-highvalue-latest-reindex
    pipeline: mdvm-vulnerability-status
  script:
    source: "ctx._id = ctx._source.microsoft.mdvm.id"
- name: reindex-mdvm-vuln-macos-latest
  schedule:
  - 6h
  source:
    index: transform-vseca-vgvg-mdvm-software-vulnerabilities-macos-latest
  dest:
    index: transform-vseca-vgvg-mdvm-software-vulnerabilities-macos-latest-reindex
    pipeline: mdvm-vulnerability-status
  script:
    source: "ctx._id = ctx._source.microsoft.mdvm.id"
- name: reindex-mdvm-vuln-highexploitable-latest
  schedule:
  - 6h
  source:
    index: transform-vseca-vgvg-mdvm-software-vulnerabilities-highexploitable-latest
  dest:
    index: transform-vseca-vgvg-mdvm-software-vulnerabilities-highexploitable-latest-reindex
    pipeline: mdvm-vulnerability-status
  script:
    source: "ctx._id = ctx._source.microsoft.mdvm.id"
- name: trendmicro-xdr-to-staging-index
  schedule:
  - 6h
  source:
    index:
    - vseca-vgvg-trendmicro-xdr-endpoints
    _source:
    - host.name
    query:
      bool:
        should:
          - range:
              trendmicro.xdr.eppAgent.lastConnectedDateTime:
                gte: now-30d/d
          - range:
              trendmicro.xdr.edrSensor.lastConnectedDateTime:
                gte: now-30d/d
        must_not:
          - exists:
              field: trendmicro.xdr.eppAgent.virtualMachineDetails.cloudAccountId
        minimum_should_match: 1
  dest:
    index: vseca-vgvg-iteh-asset-staging-list
    pipeline: set-created-time
  script:
    source: "ctx._id = ctx._source.host.name"
- name: trendmicro-xdr-to-cloud-staging-index
  schedule:
  - 6h
  source:
    index:
    - vseca-vgvg-trendmicro-xdr-endpoints
    _source:
    - host.hostname
    query:
      bool:
        should:
          - range:
              trendmicro.xdr.eppAgent.lastConnectedDateTime:
                gte: now-30d/d
          - range:
              trendmicro.xdr.edrSensor.lastConnectedDateTime:
                gte: now-30d/d
        must:
          - exists:
              field: trendmicro.xdr.eppAgent.virtualMachineDetails.cloudAccountId
        minimum_should_match: 1
  dest:
    index: vseca-vgvg-iteh-cloud-asset-staging-list
    pipeline: set-created-time
  script:
    source: "ctx._id = ctx._source.host.hostname"
